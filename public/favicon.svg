  </defs>

  <!-- The previous icon was a detailed browser illustration: unreadable at
       16px, which is the size that actually matters for a tab. A two-letter
       monogram on a filled tile survives the downscale. Palette matches
       Profile.scss (#60a5fa / #818cf8). -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <g fill="none" stroke="#0b1020" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- A -->
    <path d="M12 47 21 17l9 30"/>
    <path d="M16 37h10"/>
    <!-- K -->
    <path d="M37 17v30"/>
