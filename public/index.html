<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Photographic mark, so raster rather than SVG. The .ico carries real
         16/32/48/64 renders — letting the browser downscale one large image
         to 16px turns a face to mush. ?v= busts the favicon cache, which
         browsers hold far longer than page cache. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=4" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/favicon-512.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Abesh Kumar — Python full stack developer. ReactJS, Flask, REST APIs, MySQL, PostgreSQL and MongoDB."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png?v=4" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <!--
      Fonts belong in the head. They were previously a <link> rendered inside
      the React tree, which means the browser only discovers them after the
      bundle has parsed and mounted — a guaranteed flash of unstyled text.
      preconnect opens the connections while the HTML is still parsing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Apply the stored theme before first paint. React sets the same attribute
      on mount, but that happens after the browser has already painted, so
      without this a returning visitor sees a flash of the wrong theme.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Portfolio | Abesh Kumar </title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
